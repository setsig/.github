name: Bug Report
description: Create a report to help us improve setsig infrastructure or SDKs
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        *If this is a security vulnerability, please email `security@setsig.com` instead.*
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - setsig-backend (Go API Engine)
        - setsig-console (Partner Portal)
        - setsig-marketing (Documentation & Showcase)
        - setsig-sdks/react (@setsig/react)
        - setsig-sdks/ios (SetsigSDK)
        - setsig-sdks/android (setsig-android)
        - setsig-sdks/go (setsig-go)
        - setsig-sdks/node (@setsig/node)
        - setsig-sdks/python (setsig)
        - setsig-sdks/browser (@setsig/browser)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Initialize client with '...'
        2. Call session.verify()
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
